name: Memento Android

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: memento-android-${{ github.ref }}
  queue: max

jobs:
  android:
    if: github.repository == 'Rhaizel02/memento' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Install Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0"'

      - name: Test and assemble the debug APK
        env:
          TMDB_API_KEY: ${{ env.FIREBASE_APP_ID != '' && secrets.TMDB_API_KEY || '' }}
          RAWG_API_KEY: ${{ env.FIREBASE_APP_ID != '' && secrets.RAWG_API_KEY || '' }}
          OPEN_LIBRARY_CONTACT: ${{ env.FIREBASE_APP_ID != '' && secrets.OPEN_LIBRARY_CONTACT || '' }}
          KEYSTORE_BASE64: ${{ env.FIREBASE_APP_ID != '' && secrets.MEMENTO_DEBUG_KEYSTORE_BASE64 || '' }}
        run: |
          if [[ -n "$FIREBASE_APP_ID" ]]; then
            : "${TMDB_API_KEY:?Set the TMDB_API_KEY Actions secret}"
            : "${RAWG_API_KEY:?Set the RAWG_API_KEY Actions secret}"
            : "${KEYSTORE_BASE64:?Set the MEMENTO_DEBUG_KEYSTORE_BASE64 Actions secret}"
            umask 077
            MEMENTO_DEBUG_KEYSTORE=$(mktemp "$RUNNER_TEMP/memento-signing.XXXXXX.keystore")
            trap 'rm -f -- "$MEMENTO_DEBUG_KEYSTORE"' EXIT
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$MEMENTO_DEBUG_KEYSTORE"
            export MEMENTO_DEBUG_KEYSTORE
          fi
          unset KEYSTORE_BASE64
          export MEMENTO_VERSION_CODE=$((GITHUB_RUN_NUMBER + 1))
          bash ./gradlew --no-daemon --no-build-cache testDebugUnitTest assembleDebug

      - name: Verify the signing certificate
        if: env.FIREBASE_APP_ID != ''
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          certs=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk")
          expected='86b45d6b8b88e67776880439aa208d143f9de6eeecf4df8707647ac0c41d95d0'
          if ! grep -Fxq "Signer #1 certificate SHA-256 digest: $expected" <<< "$certs"; then
            echo '::error::The APK signature does not match the Android build already in use.'
            exit 1
          fi

      - name: Install Firebase CLI
        if: env.FIREBASE_APP_ID != ''
        run: npm install --global firebase-tools@15.37.0

      - name: Authenticate to Firebase
        if: env.FIREBASE_APP_ID != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.FIREBASE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.FIREBASE_SERVICE_ACCOUNT }}

      - name: Distribute to Firebase testers
        if: env.FIREBASE_APP_ID != ''
        env:
          FIREBASE_TESTER_GROUP: ${{ vars.FIREBASE_TESTER_GROUP }}
        run: |
          : "${FIREBASE_TESTER_GROUP:?Set the FIREBASE_TESTER_GROUP Actions variable}"
          apk=app/build/outputs/apk/debug/app-debug.apk
          notes=$(git log -1 --format='%s (%h)')
          # The CLI prints a temporary APK download URL. Keep it out of public logs.
          log=$(mktemp "$RUNNER_TEMP/firebase-distribution.XXXXXX.log")
          trap 'rm -f -- "$log"' EXIT
          if ! firebase appdistribution:distribute "$apk" --app "$FIREBASE_APP_ID" \
              --groups "$FIREBASE_TESTER_GROUP" --release-notes "$notes" --non-interactive \
              >"$log" 2>&1; then
            status=$(grep -oEm1 'HTTP Error: [0-9]{3}' "$log" | head -n1 || true)
            echo "::error::Firebase App Distribution failed${status:+ ($status)}. Check the app ID, tester group, and service account permissions."
            exit 1
          fi
          echo 'APK distributed to the Firebase tester group.'

      - name: Note pending Firebase configuration
        if: env.FIREBASE_APP_ID == ''
        run: echo '::notice::The APK passed the build. Set FIREBASE_APP_ID to enable private distribution.'
